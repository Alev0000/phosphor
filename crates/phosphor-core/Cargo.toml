[package]
name = "phosphor-core"
version = "0.1.0"
edition = "2021"
authors = ["alev"]
license = "MIT OR ISC OR Apache-2.0"
description = "Phosphor: the NTSCRT pipeline stages (digital video, glitch, downscale, screen loop) plus the librashader CRT stage"

[dependencies]
libm = "0.2"
ntsc-rs = { path = "../ntscrs" }
rayon = "1.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
png = "0.17"

[target.'cfg(windows)'.dependencies]
librashader = { version = "=0.12.1", default-features = false, features = ["runtime-d3d11", "runtime-d3d11-seh", "presets", "preprocess"] }
librashader-common = "=0.12.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
